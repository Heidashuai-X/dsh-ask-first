name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: host smoke (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax-check every source file
        run: |
          node --check lib/index.js
          node --check tools/tests/host-smoke.mjs

      - name: Run the host smoke test
        run: node tools/tests/host-smoke.mjs

      - name: Verify the bundle manifest is parseable
        run: |
          node -e "const p=require('./package.json'); if(p.dsh?.bundle?.patch!=='./cordis.patch.yml') throw new Error('dsh.bundle.patch is not wired'); if(!p.files.includes('prompts')) throw new Error('prompts/ is missing from files[]'); console.log('package.json OK')"
